    <script>
      /* Complete defense against Vite WebSocket HMR disconnect popups in iframe environment */
      (function() {
        window.addEventListener('error', function(e) {
          var msg = String((e && (e.message || (e.error && e.error.message))) || '');
          if (/websocket|vite|ws:\/\/|wss:\/\//i.test(msg)) {
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            e.preventDefault && e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || '';
          var msg = String((typeof reason === 'object' && reason ? (reason.message || reason.stack) : reason) || '');
          if (/websocket|vite|ws:\/\/|wss:\/\//i.test(msg)) {
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            e.preventDefault && e.preventDefault();
            return true;
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            try {
              var ws = new OrigWebSocket(url, protocols);
              ws.addEventListener('error', function(err) {
                err.stopImmediatePropagation && err.stopImmediatePropagation();
                err.preventDefault && err.preventDefault();
              });
              ws.addEventListener('close', function(ev) {
                ev.stopImmediatePropagation && ev.stopImmediatePropagation();
              });
              return ws;
            } catch (err) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                send: function() {},
                close: function() {},
                readyState: 3
              };
            }
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
      })();
    </script>
